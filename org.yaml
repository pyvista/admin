# --- Teams ---
teams:
  collaborators:
    description: For general collaborators that don't need to be notified of core-dev topics. Triage access to every public repo is granted automatically by the repo-sync step of the peribolos workflows.
    members:
    - whophil
    - keurfonluu
    - AlejandroFernandezLuces
    - jbusecke
    privacy: closed
    teams:
      kitware:
        description: Collaborators from @Kitware. Members inherit collaborators triage access on every public repo via team nesting; this team grants write on the core pyvista code and xarray bridge.
        members:
        - jourdain
        - ChristosT
        - alesgenova
        - annehaley
        - jspanchu
        privacy: closed
        repos:
          trame-pyvista: write
          pyvista-xarray: write
      anari:
        description: Collaborators from the Khronos ANARI ecosystem.
        members:
        - jeffamstutz
        - ingowald
        privacy: closed
        repos:
          pyvista-anari: write
  developers:
    description: Developers for the PyVista project and related packages. Write access to every public repo is granted automatically by the repo-sync step of the peribolos workflows. Trusted developers are promoted to the nested maintainers team.
    members:
    - adeak
    - danpak94
    - Louis-Pujol
    - MariusCausemann
    privacy: closed
    teams:
      maintainers:
        description: Trusted core developers responsible for triage, review, and releases. Maintain access is granted automatically on every public repo. Members inherit developers write access via team nesting.
        members:
        - bjlittle
        - edabor
        - MatthewFlamm
        - user27182
        - tkoyama010
        privacy: closed
        teams:
          # Administrative and leadership teams. Do not promote users into these as a tier.
          # Keep them in the maintainers team and add them to admin or leaders explicitly
          # based on the role they take on.
          admin:
            description: Organization admins. Admin access is granted automatically on every repo, and the admin team is the sole team with access to this repository. Members inherit developers + maintainers via team nesting.
            maintainers:
            - akaszynski
            - banesullivan
            privacy: closed
          ci-reviewers:
            description: CODEOWNERS routing target for PRs that modify CI workflows. Members inherit maintainers access via team nesting; this team itself grants no repo access.
            members:
            - akaszynski
            - banesullivan
            privacy: closed
          leaders:
            description: Community leaders for the PyVista project. Members inherit maintainers access via team nesting; this team itself grants no repo access and exists as a @pyvista/leaders mention target.
            members:
            - akaszynski
            - banesullivan
            - tkoyama010
            privacy: closed
      pyvistaqt-admin:
        description: Admins for the PyVistaQt suite of repositories
        members:
        - larsoner
        privacy: closed
        repos:
          pyvista-gui: admin
          pyvistaqt: admin
          pyvistaqt-exe: admin
          setup-headless-display-action: admin
  robots:
    description: Automation accounts
    members:
    - pyvista-bot
    privacy: secret
    repos:
      pyvista: write

# --- Repository configuration ---
#
# Every public non-archived repo gets REPO_BASELINE (squash-only merges,
# has_wiki: false, auto-merge, delete branch on merge) applied automatically
# by scripts/sync-repos.py. Entries here are deliberate per-repo deviations
# from that baseline. Keep this list short.
#
# Two things peribolos will not do with this section:
#   - Enforce auto-merge, update-branch, delete-branch-on-merge, the two
#     squash_merge_commit_* keys or web_commit_signoff_required. The pinned
#     peribolos has no config field for any of them and parses config
#     non-strictly, so those keys are read and discarded. Set them when the
#     repo is created or fix them by hand. It enforces has_wiki and the three
#     allow_*_merge keys, and nothing else this config uses.
#   - Leave an archived repo alone unless its entry says `archived: true`.
#     GitHub rejects writes to archived repos, so an entry without that key
#     fails every apply. Do not add entries for archived repos.
repos:
  admin:
    web_commit_signoff_required: true
