name: dry-run

on:
  pull_request:
    paths:
      - org.yaml
      - scripts/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  peribolos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Get app installation token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ vars.PERIBOLOS_APP_ID }}
          private-key: ${{ secrets.PERIBOLOS_APP_PRIVATE_KEY }}
          owner: pyvista

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8
        with:
          version: latest

      - name: Run peribolos (dry-run)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/run-peribolos.sh dry-run
