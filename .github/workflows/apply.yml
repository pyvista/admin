name: apply

on:
  push:
    branches: [main]
    paths:
      - org.yaml
      - scripts/**
      - .github/workflows/apply.yml
  workflow_dispatch:
  schedule:
    # Daily reconciliation so new/archived/deleted repos flow into team
    # membership without needing a PR. The scripts/sync-repos.py step is
    # what does the auto-enrollment; peribolos then applies the diff.
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: peribolos-apply
  cancel-in-progress: false

jobs:
  peribolos:
    runs-on: ubuntu-latest
    # Environment is restricted (in repo Settings → Environments) to deploy
    # only from `main`. GitHub refuses to start this job on any other ref,
    # including workflow_dispatch from a branch.
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Get app installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.PERIBOLOS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PERIBOLOS_APP_PRIVATE_KEY }}
          owner: pyvista

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8
        with:
          version: latest

      - name: Run peribolos (apply)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/run-peribolos.sh apply

  notify-failure:
    needs: peribolos
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open failure issue if none is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="cron-failure"
          gh label create "$label" \
            --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description "Scheduled workflow failure" 2>/dev/null || true
          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label "$label" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Open issue #$existing already tracks cron failures; skipping."
            exit 0
          fi
          body=$(cat <<EOF
          The scheduled \`apply\` workflow failed.

          @pyvista/admin — please investigate and close this issue once the cron is green again.

          Latest failing run: $RUN_URL
          EOF
          )
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Scheduled \`apply\` workflow is failing" \
            --label "$label" \
            --body "$body"
