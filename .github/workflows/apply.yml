name: apply

on:
  push:
    branches: [main]
    paths:
      - org.yaml
      - scripts/**
      - .github/workflows/apply.yml
  workflow_dispatch:
  schedule:
    # Daily reconciliation so new/archived/deleted repos flow into team
    # membership without needing a PR. The scripts/sync-repos.py step is
    # what does the auto-enrollment; peribolos then applies the diff.
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: peribolos-apply
  cancel-in-progress: false

jobs:
  peribolos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Get app installation token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.PERIBOLOS_APP_ID }}
          private-key: ${{ secrets.PERIBOLOS_APP_PRIVATE_KEY }}
          owner: pyvista

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: latest

      - name: Run peribolos (apply)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_ID: ${{ vars.PERIBOLOS_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PERIBOLOS_APP_PRIVATE_KEY }}
        run: scripts/run-peribolos.sh apply
